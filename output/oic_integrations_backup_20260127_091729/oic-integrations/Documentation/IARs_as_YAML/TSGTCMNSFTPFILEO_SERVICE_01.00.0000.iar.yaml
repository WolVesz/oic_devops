 xmlns:orajs3="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath948039040" xmlns:orajs14="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1001732957" xmlns:orajs0="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1957044716" xmlns:orajs10="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath2060583107" xmlns:orajs11="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath190850151" xmlns:ns22="http://xmlns.oracle.com/cloud/adapter/connectivityproperties/REST/TriggerFilesToMove_REQUEST/RESTINREQ" xmlns:ns21="http://xml.oracle.com/adapters/extension" xmlns:orajs5="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath86288" xmlns:orajs9="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1010510793" xmlns:orajs13="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1828441553" xmlns:orajs7="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1439534352" xmlns:ns3="http://www.oracle.com/XSL/Transform/java/com.bea.wli.sb.resources.icsxpathfunctions.ICSInstanceTrackingFunctions" xmlns:orajs8="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath440716342" xmlns:orajs1="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath715020271" xmlns:ns0="http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue" xmlns:orajs16="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath715584894" xmlns:ns23="http://xmlns.oracle.com/ics/cloud/ftp/move/pull" xmlns:orajs12="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath1158067111" xmlns:orajs6="http://www.oracle.com/XSL/Transform/java/oracle.tip.pc.services.functions.JsExecutor_xpath907620940">
                    - '  <xsl:param name="TargetFileName" xml:id="id_24"/>'
                    - '  <xsl:template match="/" xml:id="id_11">'
                    - '    <nstrgmpr:MoveFile xml:id="id_12">'
                    - '      <ns23:FileMoveRequest xml:id="id_29">'
                    - '        <ns23:directory xml:id="id_32">'
                    - '          <xsl:value-of xml:id="id_33" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:SourceFilePath"/>'
                    - '        <ns23:filename xml:id="id_36">'
                    - '          <xsl:value-of xml:id="id_37" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:SourceFileName"/>'
                    - '        <ns23:targetDirectory xml:id="id_34">'
                    - '          <xsl:value-of xml:id="id_35" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:TargetFilePath"/>'
                    - '        <ns23:targetFilename xml:id="id_30">'
                    - '          <xsl:value-of xml:id="id_31" select="$TargetFileName"/>'
                    - ""
                - Invoke: MoveFile(i1)
                  application:
                    Application: MoveFile(TSGTFTP_CONN)
                    name: MoveFile
                    adapter:
                        code: TSGTFTP_CONN
                    properties:
                        - name: Operation
                          value: MoveFile
                        - name: FtpConnectionType
                          value: SFTP
                        - name: Host
                          value: '%%TSGTFTP_CONN_Host'
                        - name: Port
                          value: '%%TSGTFTP_CONN_Port'
                        - name: SecurePort
                          value: "990"
                - Switch: Switch(s1)
                  routes:
                    - Route: (sc3)
                      exprProperties:
                        xpathExpression: $MoveFile/nssrcmpr:MoveFileResponse/nsmpr0:FileMoveResponse/nsmpr0:success = 'true'
                        namespaceList: nssrcmpr=http://xmlns.oracle.com/cloud/adapter/ftp/MoveFile_REQUEST/types nsmpr0=http://xmlns.oracle.com/ics/cloud/ftp/move/pull
                      stateInfo:
                        variablesReferenced:
                            - VariableName: MoveFile
                              rootElement: '{http://xmlns.oracle.com/cloud/adapter/ftp/MoveFile_REQUEST/types}MoveFileResponse'
                      statements:
                        - Assignments: MoveSuccess(l6)
                          name: MoveSuccess
                          assignments:
                            - Assignment: Assignment(a31)
                              variableName: ErrorFlag
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''N'''
                                variableName: ErrorFlag
                                variableDescription: Set Flag to N
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a32)
                              variableName: Status
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''SUCCESS'''
                                variableName: Status
                                variableDescription: Set Status to SUCCESS
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a33)
                              variableName: MsgCode
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''TSGT_CMN_FILE_ARCHIVE_SUCCESS'''
                                variableName: MsgCode
                                variableDescription: Set Success Message Code
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a34)
                              variableName: MsgDesc
                              variableType: string
                              expressionProperties:
                                xpathExpression: $TSGT_CMN_FILE_ARCHIVE_SUCCESS
                                variableName: MsgDesc
                                variableDescription: Set Success Message Description
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a35)
                              variableName: MsgDetail
                              variableType: string
                              expressionProperties:
                                xpathExpression: $MsgDesc
                                variableName: MsgDetail
                                variableDescription: Set Success Message Details
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                    - Route: Otherwise(sc4)
                      exprProperties:
                        xpathExpression: "true"
                        expressionName: Otherwise
                      stateInfo: null
                      statements:
                        - Assignments: MoveError(l7)
                          name: MoveError
                          assignments:
                            - Assignment: Assignment(a36)
                              variableName: ErrorFlag
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''Y'''
                                variableName: ErrorFlag
                                variableDescription: Set Flag to Y
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a37)
                              variableName: Status
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''ERROR'''
                                variableName: Status
                                variableDescription: Set Status to ERROR
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a38)
                              variableName: MsgCode
                              variableType: string
                              expressionProperties:
                                xpathExpression: '''TSGT_CMN_FILE_ARCHIVE_ERROR'''
                                variableName: MsgCode
                                variableDescription: Set Error Message Code
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a39)
                              variableName: MsgDesc
                              variableType: string
                              expressionProperties:
                                xpathExpression: $TSGT_CMN_FILE_ARCHIVE_ERROR
                                variableName: MsgDesc
                                variableDescription: Set Error Message Description
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Assignment: Assignment(a40)
                              variableName: MsgDetail
                              variableType: string
                              expressionProperties:
                                xpathExpression: $MsgDesc
                                variableName: MsgDetail
                                variableDescription: Set Error Message Details
                                variableType: string
                                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Route: Otherwise(sc7)
              exprProperties:
                xpathExpression: "true"
                expressionName: Otherwise
              stateInfo: null
              statements: []
        - CatchAll: CatchAll(ta1)
          statements:
            - Assignments: AssignMovingFileFault(l2)
              name: AssignMovingFileFault
              assignments:
                - Assignment: Assignment(a12)
                  variableName: ErrorFlag
                  variableType: string
                  expressionProperties:
                    xpathExpression: '''Y'''
                    variableName: ErrorFlag
                    variableDescription: Set Error flag to 'Y'
                    variableType: string
                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                - Assignment: Assignment(a13)
                  variableName: Status
                  variableType: string
                  expressionProperties:
                    xpathExpression: '''ERROR'''
                    variableName: Status
                    variableDescription: Stores as ERROR
                    variableType: string
                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                - Assignment: Assignment(a14)
                  variableName: MsgCode
                  variableType: string
                  expressionProperties:
                    xpathExpression: '''TSGT_CMN_FILE_ARCHIVE_ERROR'''
                    variableName: MsgCode
                    variableDescription: Stores moving file processing Error Message
                    variableType: string
                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                - Assignment: Assignment(a15)
                  variableName: MsgDesc
                  variableType: string
                  expressionProperties:
                    xpathExpression: concat($TSGT_CMN_FILE_ARCHIVE_ERROR,' ',ora:getFaultAsString())
                    namespaceList: ora=http://schemas.oracle.com/xpath/extension
                    variableName: MsgDesc
                    variableDescription: Stores moving file processing Error Message from lookup table
                    variableType: string
                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                - Assignment: Assignment(a16)
                  variableName: MsgDetail
                  variableType: string
                  expressionProperties:
                    xpathExpression: $MsgDesc
                    variableName: MsgDetail
                    variableDescription: Stores the actual error to Message Detail from OIC level
                    variableType: string
                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
          icsfaultfilepath: ../resources/processor_613/resourcegroup_614/ICSFault.xsd
    - Stop: Stop(st0)
