      username: Scope_GetJobStatus
      statements:
        - Assignments: AssignVariablesForCheckJobStatus(l1)
          name: AssignVariablesForCheckJobStatus
          assignments:
            - Assignment: Assignment(a7)
              variableName: waitcount
              variableType: string
              expressionProperties:
                xpathExpression: number(dvm:lookupValue('TSGTCmnConfig_LKP','ConfigName','TSGT_CMN_JOB_STATUS_WAIT_COUNT','ConfigValue','40'))
