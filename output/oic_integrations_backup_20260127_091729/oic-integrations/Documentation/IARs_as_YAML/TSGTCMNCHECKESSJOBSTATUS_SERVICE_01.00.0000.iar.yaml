                variableDescription: Set the no of Iteration from the Lookup table to wait
                variableType: string
                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Assignment: Assignment(a15)
              variableName: CheckJobStatus
              variableType: string
              expressionProperties:
                xpathExpression: '''Continue'''
                variableName: CheckJobStatus
                variableDescription: Set the Interim Status as Continue
                variableType: string
                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - While: whileLoop(wh0)
          expressionProperties:
            xpathExpression: ($CheckJobStatus = 'Continue' )and $waitcount != 0
            variableName: WhileJobStatusLoop
          statements:
            - Assignments: Delay(l2)
              name: Delay
              assignments:
                - Assignment: Assignment(a8)
