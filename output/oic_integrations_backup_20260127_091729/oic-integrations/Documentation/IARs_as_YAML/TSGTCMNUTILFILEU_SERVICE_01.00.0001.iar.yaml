                    - Invoke: UploadZIPtoSFTP(i2)
                      application:
                        Application: UploadZIPtoSFTP(TSGTFTP_CONN)
                        name: UploadZIPtoSFTP
                        adapter:
                            code: TSGTFTP_CONN
                        properties:
                            - name: Operation
                              value: WriteFile
                            - name: FtpConnectionType
                              value: SFTP
                            - name: Host
                              value: '%%TSGTFTP_CONN_Host'
                            - name: Port
                              value: '%%TSGTFTP_CONN_Port'
                            - name: SecurePort
                              value: "990"
