                                - '                  <xsl:when test="$GetWorker/workerr:executeResponse/worker:response-wrapper/worker:items[1]/worker:legislativeInfo[worker:LegislationCode=&apos;US&apos;]/worker:Gender = &apos;ORA_HRX_X&apos;">'
                                - '                    <xsl:value-of select="&apos; &apos;"/>'
