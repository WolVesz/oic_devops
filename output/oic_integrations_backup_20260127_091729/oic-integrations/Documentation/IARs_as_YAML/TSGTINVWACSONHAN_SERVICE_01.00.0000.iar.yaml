Orchestration: ""
statements:
    - Receive: Receive(r0)
      trackingvariables:
        - role: tracking_var_1
          primary: true
          name: Transaction Id
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/TransactionId
        - role: tracking_var_2
          name: Source
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/Source
        - role: tracking_var_3
          name: File Name
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/FileName
    - Assignments: AssignGlobalVariables(l0)
      name: AssignGlobalVariables
      assignments:
        - Assignment: Assignment(a0)
          variableName: FlowId
          variableType: string
          expressionProperties:
            xpathExpression: ora:getFlowId( )
            namespaceList: ora=http://schemas.oracle.com/xpath/extension
            variableName: FlowId
            variableDescription: Set the OIC unique Id for Flow Trace
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a1)
          variableName: BaseFolderpath
          variableType: string
          expressionProperties:
            xpathExpression: concat( "/temp/", $FlowId, "/")
            variableName: BaseFolderpath
            variableDescription: Set Base Folder Path for Stagging
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a2)
          variableName: CurrentDateTime
          variableType: string
          expressionProperties:
            xpathExpression: concat(substring-before(substring-before (string (fn:current-dateTime() ), "." ),':'),substring-before(substring-after(substring-before (string (fn:current-dateTime() ), "." ),':'),':'))
            namespaceList: fn=http://www.w3.org/2005/xpath-functions
            variableName: CurrentDateTime
            variableDescription: Set the Current Date Time
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a3)
          variableName: OICTempFileName
          variableType: string
          expressionProperties:
            xpathExpression: concat( $CurrentDateTime, ".csv")
            variableName: OICTempFileName
            variableDescription: Set the Stage File Name
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a4)
          variableName: StageFilePath
          variableType: string
          expressionProperties:
            xpathExpression: concat( $BaseFolderpath, "mediator")
            variableName: StageFilePath
            variableDescription: Set the Stage File Path
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a5)
          variableName: ErrorFlag
          variableType: string
          expressionProperties:
            xpathExpression: '"N"'
            variableName: ErrorFlag
            variableDescription: Set Error flag used in the interface orchestration
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a9)
          variableName: Status
          variableType: string
          expressionProperties:
            xpathExpression: '"SUCCESS"'
            variableName: Status
            variableDescription: Set Intg Flow Tracker Prc Status
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a10)
          variableName: TotColEnrichedinDataSync
          variableType: string
          expressionProperties:
            xpathExpression: dvm:lookupValue('TSGTCmnConfig_LKP','ConfigName','TotColEnrichedinDataSync','ConfigValue','')
            namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
            variableName: TotColEnrichedinDataSync
            variableDescription: Set the Enriched Column for Data Sync
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a11)
          variableName: TotalRowsInFile
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: TotalRowsInFile
            variableDescription: Set this to 0 initially
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a41)
          variableName: OICTempFileName
          variableType: string
          expressionProperties:
            xpathExpression: '"TempFile"'
            variableName: OICTempFileName
            variableDescription: Set the Temp file name for Stage Read Write
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a14)
          variableName: OICFileEnriched
          variableType: string
