            xpathExpression: '''SFTPFileEnrichedData.csv'''
            variableName: OICFileEnriched
            variableDescription: Set the Enriched Filename
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a15)
          variableName: OICFileDownloadpath
          variableType: string
          expressionProperties:
            xpathExpression: concat( $BaseFolderpath, "OICVF")
            variableName: OICFileDownloadpath
            variableDescription: Set the Download file path to Stage
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a16)
          variableName: OICFile
          variableType: string
          expressionProperties:
            xpathExpression: '''SFTPFileData.csv'''
            variableName: OICFile
            variableDescription: Set the OIC Stage File Name
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a17)
          variableName: FileDelimitter
          variableType: string
          expressionProperties:
            xpathExpression: /nssrcmpr:execute/nsmpr3:request-wrapper/nsmpr3:CMN_MEDIATOR_DATAINSERT/nsmpr3:Attribute1
            namespaceList: nssrcmpr=http://xmlns.oracle.com/cloud/adapter/REST/InsertStageDataService_REQUEST/types nsmpr3=http://xmlns.oracle.com/cloud/adapter/REST/InsertStageDataService/types
            variableName: FileDelimitter
            variableDescription: Set the delimiter from metadata config table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a6)
          variableName: MsgCode
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgCode
            variableDescription: Set Error or success Message Code
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a7)
          variableName: MsgDesc
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgDesc
            variableDescription: Set Error or success Message Description from Lookup Table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a8)
          variableName: MsgDetail
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgDetail
            variableDescription: Set Error or success Message Description from Lookup Table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a33)
          variableName: FileLineNumber
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: FileLineNumber
            variableDescription: 'File Line number : this value will be stored in the ibfile stage table.'
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a34)
          variableName: Counter
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: Counter
            variableDescription: Initialize Counter for no of rows in the source file
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a35)
          variableName: SegmentValue
          variableType: string
          expressionProperties:
            xpathExpression: number(200)
            variableName: SegmentValue
            variableDescription: Set the Segment value while doing the increment of Counter
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a40)
          variableName: TSGT_SYSTEM_ERROR
          variableType: string
          expressionProperties:
            xpathExpression: dvm:lookupValue('TSGTCmnMsgCode_LKP','MessageCode','TSGT_SYSTEM_ERROR','MessageDescr','System Error :')
            namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
            variableName: TSGT_SYSTEM_ERROR
            variableDescription: 'Set the Error Message - System Error :'
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a39)
          variableName: FileRef
          variableType: string
          expressionProperties:
            xpathExpression: ''''''
            variableName: FileRef
            variableDescription: Set the File Ref from Object Storage
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a42)
          variableName: SkipFlag
          variableType: string
          expressionProperties:
            xpathExpression: '"N"'
            variableName: SkipFlag
            variableDescription: Used to Skip any part of the logic
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
