                                            - '  <xsl:param name="CurrentFile" xml:id="id_61"/>'
                                            - '  <xsl:template match="/" xml:id="id_11">'
                                            - '    <nstrgmpr:DeleteFile xml:id="id_12">'
                                            - '      <ns53:FileDeleteRequest xml:id="id_103">'
                                            - '        <ns53:directory xml:id="id_104">'
                                            - '          <xsl:value-of xml:id="id_105" select="$CurrentFile/nsmpr0:File/nsmpr0:directory"/>'
                                            - '        <ns53:filename xml:id="id_106">'
                                            - '          <xsl:value-of xml:id="id_107" select="$CurrentFile/nsmpr0:File/nsmpr0:filename"/>'
                                            - ""
                                        - Invoke: DeleteSourceFile(i12)
                                          application:
                                            Application: DeleteSourceFile(TSGTFTP_CONN)
                                            name: DeleteSourceFile
                                            adapter:
                                                code: TSGTFTP_CONN
                                            properties:
                                                - name: Operation
                                                  value: DeleteFile
                                                - name: FtpConnectionType
                                                  value: SFTP
                                                - name: Host
                                                  value: '%%TSGTFTP_CONN_Host'
                                                - name: Port
                                                  value: '%%TSGTFTP_CONN_Port'
                                                - name: SecurePort
                                                  value: "990"
                                    - Assignments: SuccessStatus(l5)
                                      name: SuccessStatus
                                      assignments:
                                        - Assignment: Assignment(a29)
                                          variableName: Status
                                          variableType: string
                                          expressionProperties:
                                            xpathExpression: '"SUCCESS"'
                                            variableName: Status
                                            variableType: string
                                            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                        - Assignment: Assignment(a34)
                                          variableName: fileMessage
                                          variableType: string
                                          expressionProperties:
                                            xpathExpression: '"FILE PULLED SUCCESS"'
                                            variableName: fileMessage
                                            variableType: string
                                            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Route: Otherwise(sc12)
                                  exprProperties:
                                    xpathExpression: "true"
                                    expressionName: Otherwise
                                  stateInfo: null
                                  statements:
                                    - Assignments: NoFileFoundStatus(l11)
                                      name: NoFileFoundStatus
                                      assignments:
                                        - Assignment: Assignment(a62)
                                          variableName: fileMessage
                                          variableType: string
                                          expressionProperties:
                                            xpathExpression: '"NO_FILE_FOUND"'
                                            variableName: fileMessage
                                            variableType: string
                                            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - CatchAll: CatchAll(ta1)
                              statements:
                                - Assignments: ErrorStatus(l6)
                                  name: ErrorStatus
                                  assignments:
                                    - Assignment: Assignment(a30)
                                      variableName: Status
                                      variableType: string
                                      expressionProperties:
                                        xpathExpression: '''ERROR'''
                                        variableName: Status
                                        variableType: string
                                        variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                    - Assignment: Assignment(a35)
                                      variableName: fileMessage
                                      variableType: string
                                      expressionProperties:
                                        xpathExpression: '''MFT-ERROR'''
                                        variableName: fileMessage
                                        variableType: string
                                        variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                              icsfaultfilepath: ../resources/processor_3625/resourcegroup_3626/ICSFault.xsd
                        - Switch: Switch(s1)
