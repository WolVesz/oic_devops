                    - '          <xsl:value-of xml:id="id_43" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:CMN_MEDIATOR_DATAINSERT/nssrcdfl:Namespace"/>'
                    - '        <ns27:bucketName xml:id="id_44">'
                    - '          <xsl:value-of xml:id="id_45" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:CMN_MEDIATOR_DATAINSERT/nssrcdfl:BucketName"/>'
                    - '        <ns27:objectName xml:id="id_46">'
                    - '          <xsl:value-of xml:id="id_47" select="/nssrcmpr:execute/nssrcdfl:request-wrapper/nssrcdfl:CMN_MEDIATOR_DATAINSERT/nssrcdfl:FileName"/>'
                    - ""
                - Invoke: DownloadFileFromBucket(i0)
                  application:
                    Application: DownloadFileFromBucket(TSGTOBJECTSTORAG_CONN)
                    name: DownloadFileFromBucket
                    adapter:
                        code: TSGTOBJECTSTORAG_CONN
                    properties:
                        - name: operationPath
                          value: http://xmlns.oracle.com/cloud/adapter/REST/DownloadFileFromBucket_REQUEST/execute
                        - name: HttpVerb
                          value: GET
                        - name: ResourceURI
                          value: /n/{nameSpaceName}/b/{bucketName}/o/{objectName}
                - Assignments: SetFileRef(l8)
                  name: SetFileRef
                  assignments:
                    - Assignment: Assignment(a38)
                      variableName: FileRef
                      variableType: string
                      expressionProperties:
                        xpathExpression: $DownloadFileFromBucket/nsmpr9:executeResponse/nsmpr1:streamReference
                        namespaceList: nsmpr9=http://xmlns.oracle.com/cloud/adapter/REST/DownloadFileFromBucket_REQUEST/types nsmpr1=http://xmlns.oracle.com/cloud/ics/binary/v1/types
                        variableName: FileRef
                        variableDescription: Set File Ref
                        variableType: string
                        variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Route: Otherwise(sc1)
              exprProperties:
                xpathExpression: "true"
                expressionName: Otherwise
              stateInfo: null
              statements: []
        - CatchAll: CatchAll(ta0)
          statements:
