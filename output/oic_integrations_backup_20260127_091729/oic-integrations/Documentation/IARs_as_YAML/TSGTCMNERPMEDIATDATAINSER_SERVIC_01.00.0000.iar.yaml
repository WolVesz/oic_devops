                  expressionProperties:
                    xpathExpression: 'concat($DownloadSFTPtoStaggingFaultObject/nsmpr7:fault/nsmpr7:errorCode,'' : '',ora:getContentAsString($DownloadSFTPtoStaggingFaultObject/nsmpr7:fault/nsmpr7:details))'
                    namespaceList: nsmpr7=http://www.oracle.com/2014/03/ics/fault ora=http://schemas.oracle.com/xpath/extension
                    variableName: MsgDetail
                    variableDescription: Set the system Error code concatenated with the loop up value
