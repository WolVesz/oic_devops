Orchestration: ""
statements:
    - IntegrationMetadata: IntegrationMetadata(im0)
      id: im0
      refuri: processor_5332
      xsdfilepath: ../resources/processor_5332/resourcegroup_5333/ICSIntegrationMetadata.xsd
    - Receive: Receive(r0)
      trackingvariables:
        - role: tracking_var_1
          primary: true
          name: Transaction Id
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/TransactionId
        - role: tracking_var_2
          name: Source
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/Source
        - role: tracking_var_3
          name: File Name
          xpath: /execute/request-wrapper/CMN_MEDIATOR_DATAINSERT/FileName
    - Assignments: AssignGlobalVariables(l0)
      name: AssignGlobalVariables
      assignments:
        - Assignment: Assignment(a0)
          variableName: FlowId
          variableType: string
          expressionProperties:
            xpathExpression: ora:getFlowId( )
            namespaceList: ora=http://schemas.oracle.com/xpath/extension
            variableName: FlowId
            variableDescription: Set the OIC unique Id for Flow Trace
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a1)
          variableName: BaseFolderpath
          variableType: string
          expressionProperties:
            xpathExpression: concat( "/temp/", $FlowId, "/")
            variableName: BaseFolderpath
            variableDescription: Set Base Folder Path for Stagging
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a2)
          variableName: CurrentDateTime
          variableType: string
          expressionProperties:
            xpathExpression: concat(substring-before(substring-before (string (fn:current-dateTime() ), "." ),':'),substring-before(substring-after(substring-before (string (fn:current-dateTime() ), "." ),':'),':'))
            namespaceList: fn=http://www.w3.org/2005/xpath-functions
            variableName: CurrentDateTime
            variableDescription: Set the Current Date Time
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a3)
          variableName: OICTempFileName
          variableType: string
          expressionProperties:
            xpathExpression: concat( $CurrentDateTime, ".csv")
            variableName: OICTempFileName
            variableDescription: Set the Stage File Name
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a4)
          variableName: StageFilePath
          variableType: string
          expressionProperties:
            xpathExpression: concat( $BaseFolderpath, "mediator")
            variableName: StageFilePath
            variableDescription: Set the Stage File Path
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a5)
          variableName: ErrorFlag
          variableType: string
          expressionProperties:
            xpathExpression: '"N"'
            variableName: ErrorFlag
            variableDescription: Set Error flag used in the interface orchestration
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a9)
          variableName: Status
          variableType: string
          expressionProperties:
            xpathExpression: '"SUCCESS"'
            variableName: Status
            variableDescription: Set Intg Flow Tracker Prc Status
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a10)
          variableName: TotColEnrichedinDataSync
          variableType: string
          expressionProperties:
            xpathExpression: dvm:lookupValue('TSGTCmnConfig_LKP','ConfigName','TotColEnrichedinDataSync','ConfigValue','')
            namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
            variableName: TotColEnrichedinDataSync
            variableDescription: Set the Enriched Column for Data Sync
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a11)
          variableName: TotalRowsInFile
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: TotalRowsInFile
            variableDescription: Set this to 0 initially
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a14)
          variableName: OICFileEnriched
          variableType: string
          expressionProperties:
            xpathExpression: '''SFTPFileEnrichedData.csv'''
            variableName: OICFileEnriched
            variableDescription: Set the Enriched Filename
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a15)
          variableName: OICFileDownloadpath
          variableType: string
          expressionProperties:
            xpathExpression: concat( $BaseFolderpath, "OICVF")
            variableName: OICFileDownloadpath
            variableDescription: Set the Download file path to Stage
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a16)
          variableName: OICFile
          variableType: string
          expressionProperties:
            xpathExpression: '''SFTPFileData.csv'''
            variableName: OICFile
            variableDescription: Set the OIC Stage File Name
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a17)
          variableName: FileDelimitter
          variableType: string
          expressionProperties:
            xpathExpression: /nssrcmpr:execute/nsmpr3:request-wrapper/nsmpr3:CMN_MEDIATOR_DATAINSERT/nsmpr3:Attribute1
            namespaceList: nssrcmpr=http://xmlns.oracle.com/cloud/adapter/REST/InsertStageDataService_REQUEST/types nsmpr3=http://xmlns.oracle.com/cloud/adapter/REST/InsertStageDataService/types
            variableName: FileDelimitter
            variableDescription: Set the delimiter from metadata config table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a6)
          variableName: MsgCode
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgCode
            variableDescription: Set Error or success Message Code
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a7)
          variableName: MsgDesc
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgDesc
            variableDescription: Set Error or success Message Description from Lookup Table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a8)
          variableName: MsgDetail
          variableType: string
          expressionProperties:
            xpathExpression: '""'
            variableName: MsgDetail
            variableDescription: Set Error or success Message Description from Lookup Table
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a33)
          variableName: FileLineNumber
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: FileLineNumber
            variableDescription: 'File Line number : this value will be stored in the ibfile stage table.'
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a34)
          variableName: Counter
          variableType: string
          expressionProperties:
            xpathExpression: number(0)
            variableName: Counter
            variableDescription: Initialize Counter for no of rows in the source file
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a35)
          variableName: SegmentValue
          variableType: string
          expressionProperties:
            xpathExpression: number(200)
            variableName: SegmentValue
            variableDescription: Set the Segment value while doing the increment of Counter
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a40)
          variableName: TSGT_SYSTEM_ERROR
          variableType: string
          expressionProperties:
            xpathExpression: dvm:lookupValue('TSGTCmnMsgCode_LKP','MessageCode','TSGT_SYSTEM_ERROR','MessageDescr','System Error :')
            namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
            variableName: TSGT_SYSTEM_ERROR
            variableDescription: 'Set the Error Message - System Error :'
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
        - Assignment: Assignment(a39)
          variableName: FileRef
          variableType: string
          expressionProperties:
            xpathExpression: ''''''
            variableName: FileRef
            variableDescription: Set the File Ref from Object Storage
            variableType: string
            variableTypeNamespace: http://www.w3.org/2001/XMLSchema
    - Try: Try(t0)
      username: DownloadSFTPtoStagging
      statements:
        - Switch: Switch(s0)
          routes:
            - Route: (sc0)
              exprProperties:
                xpathExpression: $ErrorFlag = "N"
              stateInfo:
                variablesReferenced:
                    - VariableName: ErrorFlag
                      rootElement: '{http://www.w3.org/2001/XMLSchema}string'
              statements:
                - Map: Map(m1)
                  xsltfilepath: ../resources/processor_4377/resourcegroup_4380/req_cdd9d3fbb8bc4ae58c28f6b9a8857eb9.xsl
                  mapsentences:
                    - <?xml version = '1.0' encoding = 'UTF-8'?>
