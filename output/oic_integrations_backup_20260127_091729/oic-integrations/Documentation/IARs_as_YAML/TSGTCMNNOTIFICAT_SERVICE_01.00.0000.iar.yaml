                variableName: downloadableLink
                variableDescription: ERP UCM link download URL
                variableType: string
                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Assignment: Assignment(a23)
              variableName: Emailcontent
              variableType: string
              expressionProperties:
                xpathExpression: ''''''
                variableName: Emailcontent
