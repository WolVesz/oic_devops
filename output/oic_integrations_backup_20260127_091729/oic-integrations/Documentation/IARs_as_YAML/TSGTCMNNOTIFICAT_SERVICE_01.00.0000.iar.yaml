            - Assignment: Assignment(a35)
              variableName: Integration_Admin_emailIDs
              variableType: string
              expressionProperties:
                xpathExpression: dvm:lookupValue('TSGTCmnConfig_LKP','ConfigName','Integration_Admin_emailIDs','ConfigValue','')
                namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
