              variableType: string
              expressionProperties:
                xpathExpression: ''''''
                variableName: MsgCode
                variableDescription: MessageCode
                variableType: string
                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Assignment: Assignment(a4)
              variableName: MsgDescr
              variableType: string
              expressionProperties:
                xpathExpression: ''''''
                variableName: MsgDescr
                variableDescription: Descr
                variableType: string
                variableTypeNamespace: http://www.w3.org/2001/XMLSchema
            - Assignment: Assignment(a41)
              variableName: MsgDetails
              variableType: string
              expressionProperties:
                xpathExpression: ''''''
                variableName: MsgDetails
                variableDescription: Message Details
