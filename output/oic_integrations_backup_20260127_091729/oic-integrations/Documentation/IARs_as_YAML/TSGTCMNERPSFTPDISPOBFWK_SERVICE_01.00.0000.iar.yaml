                                - ""
                            - Invoke: UpdateObjectStorageExtractDetails(i25)
                              application:
                                Application: UpdateObjectStorageExtractDetails(TSGTRESTVBCSBO_CONN)
                                name: UpdateObjectStorageExtractDetails
                                adapter:
                                    code: TSGTRESTVBCSBO_CONN
                                properties:
                                    - name: operationPath
                                      value: http://xmlns.oracle.com/cloud/adapter/REST/UpdateObjectStorageExtractDetails_REQUEST/execute
                                    - name: HttpVerb
                                      value: POST
                                    - name: ResourceURI
                                      value: /FWKBICCEXTRACTS
                        - Switch: Switch(s2)
                          routes:
                            - Route: (sc5)
                              exprProperties:
                                xpathExpression: $BICCSFTPStatus = 'SUCCESS'
                              stateInfo:
                                variablesReferenced:
                                    - VariableName: BICCSFTPStatus
                                      rootElement: '{http://www.w3.org/2001/XMLSchema}string'
                              statements:
                                - Assignments: Assign_SFTPStatus_Success(l6)
                                  name: Assign_SFTPStatus_Success
                                  assignments:
                                    - Assignment: Assignment(a50)
                                      variableName: Status
                                      variableType: string
                                      expressionProperties:
                                        xpathExpression: '''SUCCESS'''
                                        variableName: Status
                                        variableDescription: Set the Status to SUCCESS
                                        variableType: string
                                        variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                            - Route: Otherwise(sc6)
                              exprProperties:
                                xpathExpression: "true"
                                expressionName: Otherwise
                              stateInfo: null
                              statements:
                                - Assignments: Assign_SFTPStatus_Error(l14)
                                  name: Assign_SFTPStatus_Error
                                  assignments:
                                    - Assignment: Assignment(a16)
                                      variableName: Status
                                      variableType: string
                                      expressionProperties:
                                        xpathExpression: '''ERROR'''
                                        variableName: Status
                                        variableDescription: Set the Upload to Sftp Status as ERROR
                                        variableType: string
                                        variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                        - CatchAll: CatchAll(ta3)
                          statements:
                            - Assignments: SetBICCDispatcherError(l30)
                              name: SetBICCDispatcherError
                              assignments:
                                - Assignment: Assignment(a141)
                                  variableName: ErrorFlag
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: '"Y"'
                                    variableName: ErrorFlag
                                    variableDescription: Set the Error Flag to Y
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a150)
                                  variableName: Status
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: '"ERROR"'
                                    variableName: Status
                                    variableDescription: Set the Status to Error
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a151)
                                  variableName: MsgCode
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: '''TSGT_CMN_BICC_DISPATCHER_INVOCATION_ERROR'''
                                    variableName: MsgCode
                                    variableDescription: Set the Message Code
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a152)
                                  variableName: MsgDescr
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: concat($TSGT_CMN_SYSTEM_ERROR,', ',ora:getFaultAsString())
                                    namespaceList: ora=http://schemas.oracle.com/xpath/extension
                                    variableName: MsgDescr
                                    variableDescription: Set the Message Description
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a153)
                                  variableName: MsgDetail
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: ora:getFaultAsString()
                                    namespaceList: ora=http://schemas.oracle.com/xpath/extension
                                    variableName: MsgDetail
                                    variableDescription: Set the Message Detail
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a154)
                                  variableName: InstanceUpsertCode
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: dvm:lookupValue('TSGTCmnProcessingStatus_LKP','DOMAIN_NAME','Processed-Error','DOMAIN_VALUE',' ')
                                    namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
                                    variableName: InstanceUpsertCode
                                    variableDescription: Set the Instance Upsert Code
                                    variableType: string
                                    variableTypeNamespace: http://www.w3.org/2001/XMLSchema
                                - Assignment: Assignment(a155)
                                  variableName: TransactionUpsertCode
                                  variableType: string
                                  expressionProperties:
                                    xpathExpression: dvm:lookupValue('TSGTCmnLogStatus_LKP','DOMAIN_NAME','Error','DOMAIN_VALUE',' ')
                                    namespaceList: dvm=http://www.oracle.com/XSL/Transform/java/oracle.tip.dvm.LookupValue
